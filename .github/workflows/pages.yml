name: Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Pix key
        env:
          PIX: ${{ secrets.SUBDRIVE_PIX_KEY }}
        run: |
          # Without the secret the page keeps the placeholder and hides the section.
          if [ -n "$PIX" ]; then
            python3 -c 'import os,pathlib; p=pathlib.Path("docs/index.html"); p.write_text(p.read_text().replace("__PIX_KEY__", os.environ["PIX"]))'
          fi
      - name: Visit counter
        env:
          CF_TOKEN: ${{ vars.SUBDRIVE_CF_TOKEN }}
        run: |
          # Cloudflare Web Analytics token (public, it goes in the page). Without it, the counter is left out.
          python3 - <<'PY'
          import os, pathlib, re
          token = os.environ.get("CF_TOKEN", "").strip()
          for p in pathlib.Path("docs").glob("*.html"):
              s = p.read_text()
              if token:
                  s = s.replace("__CF_TOKEN__", token)
              else:
                  s = re.sub(r'<script defer src="https://static.cloudflareinsights.com/beacon.min.js"[^\n]*\n', "", s)
                  s = s.replace("  <li>Esta página conta as visitas de forma anônima, pelo Cloudflare Web Analytics, sem cookies.</li>\n", "")
              p.write_text(s)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
