name: Desktop

on:
  push:
    branches: ["desktop/**"]
  pull_request:
    paths: ["subdrive/**", "tests/**", "packaging/**", "requirements*.txt", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: Linux-x86_64
          - os: windows-latest
            artifact: Windows-x86_64
          - os: macos-latest
            artifact: macOS-AppleSilicon
          - os: macos-15-intel
            artifact: macOS-Intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements-desktop.txt pyinstaller==6.16.0
      - name: Test engine and desktop
        run: python -m unittest discover -s tests -t .
      - name: Launch desktop from source
        run: python tools/desktop_source_smoke.py
      - name: Build self-contained application
        run: pyinstaller --noconfirm --clean packaging/desktop.spec
      - name: Launch bundled desktop without Python
        run: |
          python tools/desktop_bundle_smoke.py
      - name: Package portable download
        run: |
          mkdir -p out
          cp LICENSE out/LICENSE.txt
          cp packaging/DESKTOP-LEIA-ME.txt out/LEIA-ME.txt
          cp -R packaging/desktop-licenses out/licencas
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/SubDrive-Desktop.exe out/
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent "dist/SubDrive Desktop.app" "out/SubDrive-Desktop-${{ matrix.artifact }}.zip"
          else
            tar -czf "out/SubDrive-Desktop-${{ matrix.artifact }}.tar.gz" -C dist SubDrive-Desktop
          fi
          python -c 'import hashlib,pathlib; p=pathlib.Path("out"); (p/"SHA256SUMS.txt").write_text("".join(hashlib.sha256(f.read_bytes()).hexdigest()+"  "+f.name+"\n" for f in sorted(p.iterdir()) if f.is_file() and f.name!="SHA256SUMS.txt"))'
      - uses: actions/upload-artifact@v4
        with:
          name: SubDrive-Desktop-${{ matrix.artifact }}
          path: out/
          retention-days: 30
