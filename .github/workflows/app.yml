name: SubDrive com janelas

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            key: windows-x86_64
          - os: macos-latest
            name: macOS-AppleSilicon
            key: macos-arm64
          - os: macos-15-intel
            name: macOS-Intel
            key: macos-x86_64
          - os: ubuntu-22.04
            name: Linux
            key: linux-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas do Qt para Linux (vão dentro do programa)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxcb-randr0 libxcb-xkb1 libegl1 xvfb
      - name: Install
        run: python -m pip install -r requirements-app.txt -r packaging/requirements-build.txt
      - name: Tests (CLI e janela)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v 2>&1 | tail -40
      - name: Build
        run: pyinstaller --noconfirm --clean --distpath dist packaging/app/subdrive_app.spec
      - name: Conferir o programa neste sistema
        run: |
          set -e
          if [ -f dist/SubDrive.exe ]; then prog=dist/SubDrive.exe
          elif [ -d dist/SubDrive.app ]; then prog=dist/SubDrive.app/Contents/MacOS/SubDrive; codesign -dv dist/SubDrive.app 2>&1 | head -5 || true
          else prog=dist/SubDrive; fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1366x768x24" python tools/app_smoke.py "$prog" smoke
          else
            python tools/app_smoke.py "$prog" smoke
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telas-${{ matrix.name }}
          path: smoke/*
          if-no-files-found: ignore
      - name: Downloads (programa + pacote do player)
        run: |
          set -e
          git fetch --depth 1 origin pacotes
          prog=dist/SubDrive; [ -f dist/SubDrive.exe ] && prog=dist/SubDrive.exe; [ -d dist/SubDrive.app ] && prog=dist/SubDrive.app
          ext=""; [ -f dist/SubDrive.exe ] && ext=".exe"; [ -d dist/SubDrive.app ] && ext=".zip"
          for v in bd uhd; do
            git show FETCH_HEAD:panasonic-ub450-150-154-$v.zip > pacote-$v.zip
            python tools/make_app_download.py --program "$prog" --package pacote-$v.zip --system "${{ matrix.name }}" \
              --output downloads --update-asset programa/SubDrive-app-${{ matrix.key }}$ext
          done
      - uses: actions/upload-artifact@v4
        with:
          name: SubDrive-App-${{ matrix.name }}
          path: downloads/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: programa-app-${{ matrix.name }}
          path: programa/*
