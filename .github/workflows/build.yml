name: Build

on:
  push:
    branches: [main, desenvolvimento]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publicar esta versão (tag v + a versão do programa) com os downloads"
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            key: windows-x86_64
          - os: macos-latest
            name: macOS-AppleSilicon
            key: macos-arm64
          - os: macos-15-intel
            name: macOS-Intel
            key: macos-x86_64
          - os: ubuntu-22.04
            name: Linux
            key: linux-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt -r packaging/requirements-build.txt
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Build
        run: pyinstaller --noconfirm --clean --distpath dist packaging/subdrive.spec
      - name: Try the program
        run: |
          set -e
          exe=dist/SubDrive-CLI; [ -f dist/SubDrive-CLI.exe ] && exe=dist/SubDrive-CLI.exe
          mkdir -p try && cd try
          printf '1\n00:00:01,000 --> 00:00:03,000\nOlá — tudo bem? ♪\n\n2\n00:00:04,000 --> 00:00:06,000\n<i>Sim, é isso.</i>\n' > Filme.srt
          ../$exe --version
          ../$exe --no-emoji rules
          ../$exe --no-emoji check Filme.srt || true
          ../$exe --no-emoji fix Filme.srt --show
          ../$exe --no-emoji check Filme_2.srt
          ../$exe --no-emoji pgs Filme_2.srt --font inter --bold --color amarelo-escuro
          ../$exe --no-emoji check Filme.dark-yellow.sup
          ../$exe --no-emoji drives || true
          printf '0\n' | ../$exe | tail -3
      - name: Pack
        run: |
          mkdir -p out
          if [ -f dist/SubDrive-CLI.exe ]; then cp dist/SubDrive-CLI.exe out/SubDrive-CLI-${{ matrix.name }}.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            # ditto keeps the "can be opened" permission and opens with a double click in Finder
            chmod +x dist/SubDrive-CLI && ditto -c -k --keepParent dist/SubDrive-CLI out/SubDrive-CLI-${{ matrix.name }}.zip
          else chmod +x dist/SubDrive-CLI && tar -czf out/SubDrive-CLI-${{ matrix.name }}.tar.gz -C dist SubDrive-CLI; fi
      - uses: actions/upload-artifact@v4
        with:
          name: SubDrive-CLI-${{ matrix.name }}
          path: out/*
      - name: Downloads (program + player package)
        if: github.event_name == 'workflow_dispatch' && inputs.release
        run: |
          set -e
          git fetch --depth 1 origin pacotes
          exe=dist/SubDrive-CLI; [ -f dist/SubDrive-CLI.exe ] && exe=dist/SubDrive-CLI.exe
          for variant in bd uhd; do
            git show FETCH_HEAD:panasonic-ub450-150-154-$variant.zip > pacote-$variant.zip
            python tools/make_download.py --program $exe --package pacote-$variant.zip \
              --system "${{ matrix.name }}" --output downloads
          done
          # The bare program, for SubDrive CLI's own updates (named after the key in the signed index).
          mkdir -p programa
          ext=""; [ -f dist/SubDrive-CLI.exe ] && ext=".exe"
          cp $exe programa/SubDrive-CLI-${{ matrix.key }}$ext
      - if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: actions/upload-artifact@v4
        with:
          name: downloads-${{ matrix.name }}
          path: downloads/*.zip
      - if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: actions/upload-artifact@v4
        with:
          name: programa-${{ matrix.name }}
          path: programa/*

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: downloads-*
          merge-multiple: true
          path: downloads
      - uses: actions/download-artifact@v4
        with:
          pattern: programa-*
          merge-multiple: true
          path: programas
      - name: Signed index (for SubDrive CLI updates)
        env:
          SUBDRIVE_SIGNING_KEY: ${{ secrets.SUBDRIVE_SIGNING_KEY }}
        run: |
          set -e
          test -n "$SUBDRIVE_SIGNING_KEY" || { echo "::error::Falta o secret SUBDRIVE_SIGNING_KEY"; exit 1; }
          version="$(python3 -c 'import subdrive; print(subdrive.VERSION)')"
          channel=stable; case "$version" in *-*) channel=beta;; esac
          git fetch --depth 1 origin pacotes
          mkdir -p pacotes indice
          for v in bd uhd; do
            git show FETCH_HEAD:panasonic-ub450-150-154-$v.zip > origem-$v.zip
            python3 tools/make_package_zip.py origem-$v.zip "pacotes/SubDrive-$version-pacote-$(echo $v | tr a-z A-Z).zip" "$version"
          done
          python3 tools/make_release_index.py --version "$version" --channel $channel --notes packaging/notas.txt --out indice \
            program-windows-x86_64=programas/SubDrive-CLI-windows-x86_64.exe \
            program-macos-arm64=programas/SubDrive-CLI-macos-arm64 \
            program-macos-x86_64=programas/SubDrive-CLI-macos-x86_64 \
            program-linux-x86_64=programas/SubDrive-CLI-linux-x86_64 \
            package-panasonic-ub450-150-154-bd=pacotes/SubDrive-$version-pacote-BD.zip \
            package-panasonic-ub450-150-154-uhd=pacotes/SubDrive-$version-pacote-UHD.zip
          # The secret must match the public key built into SubDrive CLI, or nobody could update.
          python3 -c 'import sys; from pathlib import Path; from subdrive import update; update.read_index(Path("indice/subdrive-release.json").read_bytes(), Path("indice/subdrive-release.json.sig").read_bytes()); print("assinatura confere")'
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ls -l downloads programas pacotes indice
          test "$(ls downloads/*.zip | wc -l)" = 8
          test "$(ls programas | wc -l)" = 4
          version="$(python3 -c 'import subdrive; print(subdrive.VERSION)')"
          extra="--latest"; case "$version" in *-*) extra="--prerelease";; esac
          gh release create "v$version" downloads/*.zip programas/* pacotes/*.zip indice/* $extra --target "$GITHUB_SHA" \
            --title "SubDrive $version" --notes-file packaging/release-notes.md
